<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenPrintTag Scanner</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        /* Typography and Theme - Prusa Connect Aesthetic */
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&display=swap');

        :root {
            --prusa-orange: #FA6831;
            --prusa-black: #0a0a0a;
            --prusa-dark-gray: #1a1a1a;
            --prusa-medium-gray: #313131;
            --prusa-light-gray: #707070;
            --prusa-text: #efefef;
            --prusa-red: #d63031;
            --prusa-green: #2ecc71;
            --font-main: Helvetica, 'Exo 2', sans-serif;
        }

        * {
            box-sizing: border-box;
        }


        body {
            font-family: var(--font-main);
            background-color: var(--prusa-black);
            color: var(--prusa-text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* Main Container */
        .container {
            background-color: var(--prusa-dark-gray);
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s ease-out forwards;
        }

        .container.logs-expanded {
            max-width: 90vw;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .header {
            background-color: var(--prusa-black);
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--prusa-medium-gray);
        }

        .header h1 {
            color: var(--prusa-orange);
            font-weight: 700;
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 0.5px;
        }

        /* Tab Navigation */
        .tab-nav {
            display: flex;
            background-color: var(--prusa-black);
            border-bottom: 1px solid var(--prusa-medium-gray);
        }

        .tab-btn {
            flex: 1;
            padding: 1rem;
            background: none;
            border: none;
            color: var(--prusa-light-gray);
            font-family: var(--font-main);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tab-btn:hover {
            color: var(--prusa-text);
        }

        .tab-btn.active {
            color: var(--prusa-orange);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background-color: var(--prusa-orange);
        }

        /* Tab Content */
        .tab-content {
            padding: 1.5rem;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Connection UI */
        #connection-ui {
            padding: 2rem 1.5rem;
            text-align: center;
        }

        #connection-ui p {
            color: var(--prusa-light-gray);
            margin-bottom: 1.5rem;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--prusa-light-gray);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        input[type="color"],
        select {
            width: 100%;
            padding: 12px;
            background-color: var(--prusa-medium-gray);
            border: 1px solid #444;
            border-radius: 4px;
            color: var(--prusa-text);
            font-family: var(--font-main);
            font-size: 1rem;
            transition: all 0.2s ease-in-out;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--prusa-orange);
            box-shadow: 0 0 0 2px rgba(250, 104, 49, 0.2);
        }

        input[type="color"] {
            padding: 4px;
            height: 44px;
            cursor: pointer;
        }

        select {
            cursor: pointer;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            justify-content: flex-end;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-family: var(--font-main);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: var(--prusa-orange);
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            background-color: #e55a24;
            transform: translateY(-1px);
        }

        button.secondary {
            background-color: var(--prusa-medium-gray);
            color: var(--prusa-text);
        }

        button.secondary:hover {
            background-color: #3a3a3a;
        }

        button.danger {
            background-color: var(--prusa-red);
            color: #fff;
        }

        button.danger:hover {
            background-color: #b62526;
        }

        button:disabled {
            background-color: #444;
            color: #777;
            cursor: not-allowed;
            transform: none;
        }

        /* Status Area */
        #status-area {
            margin-top: 1rem;
            padding: 1rem;
            background-color: var(--prusa-medium-gray);
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #aaa;
            max-height: 120px;
            overflow-y: auto;
            display: none;
        }

        .status-message {
            margin: 0;
            padding-bottom: 4px;
        }

        .status-error { color: var(--prusa-red); }
        .status-success { color: var(--prusa-green); }

        /* Section Headers */
        .section-header {
            color: var(--prusa-light-gray);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--prusa-medium-gray);
        }

        /* Spool Cards */
        .spool-card {
            background-color: var(--prusa-medium-gray);
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: background-color 0.2s;
        }

        .spool-card:hover {
            background-color: #3a3a3a;
        }

        .spool-card.current {
            border-left: 4px solid var(--prusa-orange);
        }

        .spool-color {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .spool-info {
            flex: 1;
            min-width: 0;
        }

        .spool-type {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        .spool-manufacturer {
            color: var(--prusa-light-gray);
            font-size: 0.85rem;
        }

        .spool-meta {
            text-align: right;
            flex-shrink: 0;
        }

        .spool-grams {
            font-weight: 600;
            font-size: 1rem;
        }

        .spool-time {
            color: var(--prusa-light-gray);
            font-size: 0.8rem;
        }

        .spool-edit-btn {
            padding: 8px 12px;
            font-size: 0.8rem;
            margin-left: 0.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--prusa-light-gray);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background-color: var(--prusa-dark-gray);
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform 0.2s;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--prusa-medium-gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--prusa-text);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--prusa-light-gray);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--prusa-text);
            background: none;
            transform: none;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--prusa-medium-gray);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .modal-footer-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: flex-end;
        }

        /* Color preview in modal */
        .color-preview-row {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .color-preview-row input[type="color"] {
            width: 60px;
        }

        .color-preview-row input[type="text"] {
            flex: 1;
        }

        .consume-adjust-row {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            margin-top: 0.75rem;
        }

        .consume-adjust-row input[type="number"] {
            flex: 1;
        }

        /* Format Spool Card */
        .format-spool-card {
            background-color: var(--prusa-medium-gray);
            border-radius: 6px;
            padding: 1.5rem;
            margin-bottom: 0.75rem;
            border-left: 4px solid var(--prusa-orange);
            text-align: center;
        }

        .format-spool-card .format-uid {
            color: var(--prusa-light-gray);
            font-family: monospace;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }

        .format-spool-card .format-label {
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .format-spool-card button {
            min-width: 160px;
        }

        .log-controls {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .log-controls button {
            flex: 1;
        }

        .log-status {
            font-size: 0.8rem;
            color: var(--prusa-light-gray);
            margin-bottom: 0.75rem;
        }

        .log-view {
            background-color: #111;
            border: 1px solid #444;
            border-radius: 4px;
            min-height: 320px;
            max-height: 420px;
            overflow-y: auto;
            padding: 0.75rem;
            font-family: monospace;
            font-size: 0.8rem;
            line-height: 1.35;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .log-line {
            margin: 0;
            padding: 0 0 2px 0;
            color: #d2d2d2;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>OpenPrintTag Scanner</h1>
        </div>

        <!-- Connection UI (shown before BLE connection) -->
        <div id="connection-ui">
            <p>Connect to your OpenPrintTag device to view spools and configure settings.</p>
            <button id="connect-button">Connect to Device</button>
            <div id="status-area"></div>
        </div>

        <!-- Main App UI (shown after BLE connection) -->
        <div id="app-ui" style="display: none;">
            <!-- Tab Navigation -->
            <nav class="tab-nav">
                <button class="tab-btn active" data-tab="spools">Spools</button>
                <button class="tab-btn" data-tab="settings">Settings</button>
                <button class="tab-btn" data-tab="logs">Logs</button>
            </nav>

            <!-- Spools Tab -->
            <div id="tab-spools" class="tab-content active">
                <div class="section-header">Current Spool</div>
                <div id="current-spool-container">
                    <div class="empty-state">
                        <div class="empty-state-icon">&#128451;</div>
                        <p>No spool detected.<br>Place a tagged spool on the reader.</p>
                    </div>
                </div>

                <div class="section-header" style="margin-top: 1.5rem;">Recently Seen</div>
                <div id="recent-spools-container">
                    <div class="empty-state">
                        <p>No recent spools.</p>
                    </div>
                </div>
            </div>

            <!-- Settings Tab -->
            <div id="tab-settings" class="tab-content">
                <div class="form-group">
                    <label>Device Version</label>
                    <span id="device-version" style="color: #ccc;">—</span>
                </div>
                <form id="config-form">
                    <div class="section-header" style="margin-top: 1.5rem;">WiFi</div>
                    <div class="form-group">
                        <label for="ssid">WiFi SSID</label>
                        <input type="text" id="ssid" name="ssid" required>
                    </div>
                    <div class="form-group">
                        <label for="wifi_pass">WiFi Password (leave blank to keep existing)</label>
                        <input type="password" id="wifi_pass" name="wifi_pass">
                    </div>

                    <div class="section-header" style="margin-top: 1.5rem;">PrusaLink</div>
                    <div class="form-group">
                        <label for="prusa_link_url">PrusaLink URL</label>
                        <input type="text" id="prusa_link_url" name="prusa_link_url" placeholder="e.g., http://192.168.1.100">
                    </div>
                    <div class="form-group">
                        <label for="prusa_link_api_key">PrusaLink API Key</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="password" id="prusa_link_api_key" name="prusa_link_api_key" style="flex: 1;">
                            <button type="button" id="test-prusalink-btn" class="secondary" style="white-space: nowrap;">Test</button>
                        </div>
                        <div id="test-prusalink-result" style="margin-top: 0.5rem; font-size: 0.85rem; display: none;"></div>
                    </div>
                    <div class="form-group">
                        <label for="poll_interval_ms">Poll Interval (ms)</label>
                        <input type="number" id="poll_interval_ms" name="poll_interval_ms" min="1000">
                    </div>

                    <div class="section-header" style="margin-top: 1.5rem;">Spoolman</div>
                    <div class="form-group">
                        <label for="spoolman_url">Spoolman URL (optional)</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="text" id="spoolman_url" name="spoolman_url" placeholder="e.g., http://192.168.1.100:7912" style="flex: 1;">
                            <button type="button" id="test-spoolman-btn" class="secondary" style="white-space: nowrap;">Test</button>
                        </div>
                        <div id="test-spoolman-result" style="margin-top: 0.5rem; font-size: 0.85rem; display: none;"></div>
                    </div>

                    <div class="section-header" style="margin-top: 1.5rem;">LCD</div>
                    <div class="form-group">
                        <label for="lcd_timeout_minutes">LCD Auto-Off (minutes, 0 = never)</label>
                        <input type="number" id="lcd_timeout_minutes" name="lcd_timeout_minutes" min="0" step="1">
                    </div>

                    <div class="section-header" style="margin-top: 1.5rem;">Home Assistant</div>
                    <div class="form-group">
                        <label for="ha_enabled">Enable Home Assistant</label>
                        <select id="ha_enabled" name="ha_enabled">
                            <option value="false">Disabled</option>
                            <option value="true">Enabled</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="ha_mqtt_host">MQTT Broker Host</label>
                        <input type="text" id="ha_mqtt_host" name="ha_mqtt_host" placeholder="e.g., 192.168.1.50">
                    </div>
                    <div class="form-group">
                        <label for="ha_mqtt_port">MQTT Port</label>
                        <input type="number" id="ha_mqtt_port" name="ha_mqtt_port" min="1" max="65535" value="1883">
                    </div>
                    <div class="form-group">
                        <label for="ha_mqtt_user">MQTT Username</label>
                        <input type="text" id="ha_mqtt_user" name="ha_mqtt_user">
                    </div>
                    <div class="form-group">
                        <label for="ha_mqtt_pass">MQTT Password</label>
                        <input type="password" id="ha_mqtt_pass" name="ha_mqtt_pass">
                    </div>
                    <div class="form-group">
                        <label for="automation_mode">Automation Mode</label>
                        <select id="automation_mode" name="automation_mode">
                            <option value="0">Self Directed</option>
                            <option value="1">Controlled by Home Assistant</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <button type="button" id="test-mqtt-btn" class="secondary" style="width: 100%;">Test MQTT Connection</button>
                        <div id="test-mqtt-result" style="margin-top: 0.5rem; font-size: 0.85rem; display: none;"></div>
                    </div>

                    <div class="button-group">
                        <button type="submit" id="save-button">Save Configuration</button>
                    </div>
                </form>

                <div id="settings-status-area" class="status-area" style="margin-top: 1rem; padding: 1rem; background-color: var(--prusa-medium-gray); border-radius: 4px; font-family: monospace; font-size: 0.8rem; color: #aaa; max-height: 120px; overflow-y: auto; display: none;"></div>
            </div>

            <!-- Logs Tab -->
            <div id="tab-logs" class="tab-content">
                <div class="log-controls">
                    <button type="button" id="refresh-logs-btn">Refresh</button>
                    <button type="button" id="auto-logs-btn" class="secondary">Auto: Off</button>
                    <button type="button" id="clear-logs-btn" class="secondary">Clear View</button>
                </div>
                <div id="logs-status" class="log-status">Idle</div>
                <div id="logs-view" class="log-view"></div>
            </div>
        </div>
    </div>

    <!-- Edit Spool Modal -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>Edit Spool</h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-spool-id">
                <div class="form-group">
                    <label for="edit-type">Material Type</label>
                    <select id="edit-type">
                        <option value="PLA">PLA</option>
                        <option value="PETG">PETG</option>
                        <option value="ABS">ABS</option>
                        <option value="ASA">ASA</option>
                        <option value="TPU">TPU</option>
                        <option value="PC">PC</option>
                        <option value="Nylon">Nylon</option>
                        <option value="PVA">PVA</option>
                        <option value="HIPS">HIPS</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="edit-color">Color</label>
                    <div class="color-preview-row">
                        <input type="color" id="edit-color" value="#FF5733">
                        <input type="text" id="edit-color-hex" placeholder="#FF5733" maxlength="7">
                    </div>
                </div>
                <div class="form-group">
                    <label for="edit-manufacturer">Manufacturer</label>
                    <input type="text" id="edit-manufacturer" placeholder="e.g., Prusament">
                </div>
                <div class="form-group">
                    <label for="edit-grams">Grams Remaining</label>
                    <input type="number" id="edit-grams" min="0" max="5000" placeholder="750">
                    <div class="consume-adjust-row">
                        <button type="button" id="adjust-grams-btn" class="secondary">Adjust</button>
                        <input type="number" id="consume-amount" min="0" placeholder="Consume Amount">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="modal-footer-actions">
                    <button class="secondary" id="modal-cancel">Cancel</button>
                    <button id="modal-save">Save to Tag</button>
                </div>
                <button id="modal-format" class="danger">Format Spool</button>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const connectButton = document.getElementById('connect-button');
        const connectionUI = document.getElementById('connection-ui');
        const appUI = document.getElementById('app-ui');
        const statusArea = document.getElementById('status-area');
        const settingsStatusArea = document.getElementById('settings-status-area');
        const configForm = document.getElementById('config-form');
        const saveButton = document.getElementById('save-button');
        const appContainer = document.querySelector('.container');
        const refreshLogsButton = document.getElementById('refresh-logs-btn');
        const autoLogsButton = document.getElementById('auto-logs-btn');
        const clearLogsButton = document.getElementById('clear-logs-btn');
        const logsStatus = document.getElementById('logs-status');
        const logsView = document.getElementById('logs-view');

        // Tab elements
        const tabButtons = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');

        // Spool containers
        const currentSpoolContainer = document.getElementById('current-spool-container');
        const recentSpoolsContainer = document.getElementById('recent-spools-container');

        // Modal elements
        const editModal = document.getElementById('edit-modal');
        const modalClose = document.getElementById('modal-close');
        const modalCancel = document.getElementById('modal-cancel');
        const modalSave = document.getElementById('modal-save');
        const modalFormat = document.getElementById('modal-format');
        const editSpoolId = document.getElementById('edit-spool-id');
        const editType = document.getElementById('edit-type');
        const editColor = document.getElementById('edit-color');
        const editColorHex = document.getElementById('edit-color-hex');
        const editManufacturer = document.getElementById('edit-manufacturer');
        const editGrams = document.getElementById('edit-grams');
        const consumeAmount = document.getElementById('consume-amount');
        const adjustGramsButton = document.getElementById('adjust-grams-btn');

        // Bluetooth UUIDs
        const SERVICE_UUID = "0a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b0001";
        const CONFIG_READ_UUID = "0a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b0002";
        const CONFIG_WRITE_UUID = "0a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b0003";

        // State
        let bleDevice;
        let configWriteCharacteristic;
        let configReadCharacteristic;
        let currentSpoolData = null;
        let recentSpoolsData = [];
        let spoolPollInterval = null;
        let logPollInterval = null;
        let logCursor = 0;
        let isLogsAutoEnabled = false;
        let cachedSpoolmanUrl = '';
        const SPOOL_POLL_INTERVAL_MS = 3000;
        const LOG_POLL_INTERVAL_MS = 2000;
        const textDecoder = new TextDecoder('utf-8');
        const textEncoder = new TextEncoder();

        // Command queue for serial BLE operations
        const commandQueue = [];
        let isProcessingQueue = false;

        // Queue a command and process if not already processing
        function enqueueCommand(commandFn) {
            return new Promise((resolve, reject) => {
                commandQueue.push({ execute: commandFn, resolve, reject });
                processQueue();
            });
        }

        // Process commands one at a time
        async function processQueue() {
            if (isProcessingQueue || commandQueue.length === 0) return;

            isProcessingQueue = true;

            while (commandQueue.length > 0) {
                const { execute, resolve, reject } = commandQueue.shift();
                try {
                    const result = await execute();
                    resolve(result);
                } catch (error) {
                    reject(error);
                }
            }

            isProcessingQueue = false;
        }

        // Relative Time Formatting
        function formatRelativeTime(timestamp) {
            // Handle missing, invalid, or zero timestamps
            if (!timestamp || timestamp <= 0) {
                console.log("no time stamp")
                return 'Unknown';
            }

            const now = Date.now() / 1000;
            const diff = now - timestamp;

            // Handle future timestamps or unreasonably old ones (> 1 year)
            if (diff < 0 || diff > 31536000) {
                console.log("timestamp is not valid: " + timestamp);
                return 'Unknown';
            }

            if (diff < 60) return 'Just now';
            if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
            if (diff < 604800) return `${Math.floor(diff / 86400)}d ago`;
            return `${Math.floor(diff / 604800)}w ago`;
        }

        // BLE Connection
        async function handleConnect() {
            try {
                log('Requesting Bluetooth device...');
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }],
                    optionalServices: [SERVICE_UUID]
                });

                log(`Connecting to ${bleDevice.name}...`);
                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
                const server = await bleDevice.gatt.connect();

                log('Getting service...');
                const service = await server.getPrimaryService(SERVICE_UUID);

                log('Getting characteristics...');
                configWriteCharacteristic = await service.getCharacteristic(CONFIG_WRITE_UUID);
                configReadCharacteristic = await service.getCharacteristic(CONFIG_READ_UUID);

                log('Connection successful.', 'success');

                // Show app UI
                connectionUI.style.display = 'none';
                appUI.style.display = 'block';

                // Load data
                await loadSpools();
                await loadConfig();
                setLogsStatus('Connected');

                // Start polling for spool updates
                startSpoolPolling();

            } catch (error) {
                log(`Connection failed: ${error}`, 'error');
            }
        }

        function startSpoolPolling() {
            stopSpoolPolling();
            spoolPollInterval = setInterval(loadSpools, SPOOL_POLL_INTERVAL_MS);
        }

        function stopSpoolPolling() {
            if (spoolPollInterval) {
                clearInterval(spoolPollInterval);
                spoolPollInterval = null;
            }
        }

        async function loadSpools() {
            if (!configWriteCharacteristic || !configReadCharacteristic) return;

            try {
                await enqueueCommand(async () => {
                    await configWriteCharacteristic.writeValue(
                        textEncoder.encode('{"command":"list_spools"}')
                    );

                    const value = await configReadCharacteristic.readValue();
                    const responseJson = textDecoder.decode(value);
                    const response = JSON.parse(responseJson);

                    // D) Current spool should always be updated (show/remove as appropriate)
                    currentSpoolData = response.current || null;

                    // Handle recently seen spools with merge logic
                    const incomingRecent = response.recent || [];

                    if (incomingRecent.length > 0) {
                        recentSpoolsData = incomingRecent;
                    }
                    // B) If client sends no spools for recently seen, keep current ones visible
                    // (do nothing - recentSpoolsData stays unchanged)
                });

                renderSpools();
            } catch (error) {
                console.error('Failed to load spools:', error);
                // On error, keep existing data stable instead of clearing
                // Only clear currentSpoolData since we don't know if a spool is present
            }
        }

        async function fetchLogMeta() {
            if (!configWriteCharacteristic) throw new Error('Not connected');

            return enqueueCommand(async () => {
                await configWriteCharacteristic.writeValue(
                    textEncoder.encode('{"command":"log_meta"}')
                );
                const responseValue = await configWriteCharacteristic.readValue();
                return JSON.parse(textDecoder.decode(responseValue));
            });

        async function fetchLogLine(seq) {
            if (!configWriteCharacteristic || !configReadCharacteristic) throw new Error('Not connected');

            return enqueueCommand(async () => {
                await configWriteCharacteristic.writeValue(
                    textEncoder.encode(JSON.stringify({ command: 'log_line', seq }))
                );

                const statusValue = await configWriteCharacteristic.readValue();
                const status = JSON.parse(textDecoder.decode(statusValue));
                if (status.status === 'ok') {
                    const lineValue = await configReadCharacteristic.readValue();
                    status.line = textDecoder.decode(lineValue);
                }
                return status;
            });
        }

        async function refreshLogs() {
            if (!configWriteCharacteristic || !configReadCharacteristic) {
                setLogsStatus('Not connected', true);
                return;
            }

            try {
                setLogsStatus('Fetching...');
                const meta = await fetchLogMeta();
                if (meta.status !== 'ok') {
                    throw new Error('Failed to fetch log metadata');
                }

                if (logCursor < meta.oldest_seq || logCursor > meta.next_seq) {
                    logCursor = meta.oldest_seq;
                }

                let fetched = 0;
                let staleResetCount = 0;
                const MAX_LINES_PER_REFRESH = 200;

                while (fetched < MAX_LINES_PER_REFRESH) {
                    const lineResponse = await fetchLogLine(logCursor);
                    if (lineResponse.status === 'ok') {
                        appendLogLine(lineResponse.line);
                        logCursor = lineResponse.next_seq;
                        fetched++;
                        continue;
                    }

                    if (lineResponse.status === 'stale') {
                        if (staleResetCount > 0) {
                            break;
                        }
                        staleResetCount++;
                        logCursor = lineResponse.oldest_seq;
                        continue;
                    }

                    if (lineResponse.status === 'eof') {
                        logCursor = lineResponse.next_seq;
                        break;
                    }

                    throw new Error('Unexpected log response');
                }

                setLogsStatus(`Fetched ${fetched} line(s). next=${logCursor}`);
            } catch (error) {
                setLogsStatus(`Log fetch failed: ${error}`, true);
            }
        }

        function startLogPolling() {
            stopLogPolling();
            logPollInterval = setInterval(refreshLogs, LOG_POLL_INTERVAL_MS);
        }

        function stopLogPolling() {
            if (logPollInterval) {
                clearInterval(logPollInterval);
                logPollInterval = null;
            }
        }

        function toggleAutoLogs() {
            isLogsAutoEnabled = !isLogsAutoEnabled;
            autoLogsButton.textContent = isLogsAutoEnabled ? 'Auto: On' : 'Auto: Off';
            autoLogsButton.classList.toggle('secondary', !isLogsAutoEnabled);

            if (isLogsAutoEnabled) {
                startLogPolling();
                refreshLogs();
            } else {
                stopLogPolling();
            }
        }

        // Event Listeners
        connectButton.addEventListener('click', handleConnect);
        configForm.addEventListener('submit', handleSave);
        document.getElementById('test-spoolman-btn').addEventListener('click', handleTestSpoolman);
        document.getElementById('test-prusalink-btn').addEventListener('click', handleTestPrusalink);
        document.getElementById('test-mqtt-btn').addEventListener('click', handleTestMqtt);
        refreshLogsButton.addEventListener('click', refreshLogs);
        autoLogsButton.addEventListener('click', toggleAutoLogs);
        clearLogsButton.addEventListener('click', () => {
            logsView.innerHTML = '';
            setLogsStatus('Cleared view');
        });
    </script>
</body>
</html>
